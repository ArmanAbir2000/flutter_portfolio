name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The repo's Pages source is the `gh-pages` branch (legacy mode), so we push
# the built site there instead of using the artifact-based deploy-pages flow
# (that flow reported success but never changed what the site serves).
permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # src/convex/_generated is committed; this re-syncs it from the live
      # deployment whenever a deploy key secret is configured.
      - name: Deploy Convex functions & full typegen
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "CONVEX_DEPLOY_KEY not set - skipping backend deploy"
          else
            # Pin the CLI to the project's convex version so flags stay stable.
            npx convex@1.42.1 deploy || echo "::warning::Convex backend sync failed - check CONVEX_DEPLOY_KEY; site build continues"
          fi

      - name: Build
        env:
          # The Convex deployment this portfolio talks to — arman-abir's own
          # project. Override with a repo secret of the same name if you
          # migrate deployments.
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://ceaseless-duck-889.convex.cloud' }}
          # GitHub Pages project sites are served from a subdirectory named
          # after the repo. Keep in sync with SITE_URL in src/lib/seo.ts.
          VITE_BASE_PATH: /Shiki_Code_Studio/
        run: bun run build

      - name: SPA fallback for client-side routes
        run: node -e "require('fs').copyFileSync('dist/index.html','dist/404.html')"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
