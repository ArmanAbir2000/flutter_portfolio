  <!-- Apply the stored site theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("shiki-site-theme");
        var valid = ["studio", "brutal", "glass", "terminal", "editorial", "bento", "swiss", "aurora", "cyberpunk", "clay", "popart", "y2k", "retro", "bohemian", "handwritten", "pixel"];
        var light = { brutal: 1, editorial: 1, bento: 1, swiss: 1, clay: 1, popart: 1, y2k: 1, retro: 1, bohemian: 1, handwritten: 1 };
        var id = valid.indexOf(t) !== -1 ? t : "studio";
        document.documentElement.dataset.theme = id;
        if (light[id]) {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        } else {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
        document.documentElement.dataset.theme = "studio";
      }
    })();
  </script>
